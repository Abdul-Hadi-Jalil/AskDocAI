# Leave native memory available on 8 GB development machines.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
# Avoid a second compiler JVM competing with Gradle for memory.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental caches cannot relativize plugin sources on C: against this
# checkout on A:. Use full compilation so Windows builds work across drives.
kotlin.incremental=false
